[project]
name = "campaign-agent"
version = "0.1.0"
description = "Brand-aware campaign agent: backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "pyyaml>=6.0.3",
    "pgvector>=0.5.1",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
