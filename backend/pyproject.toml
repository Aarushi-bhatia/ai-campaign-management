[project]
name = "campaign-agent"
version = "0.1.0"
description = "Brand-aware campaign agent: backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "pyyaml>=6.0.3",
    "pgvector>=0.5.1",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify, ruff's own rules, complexity.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
    "RUF001",  # Curly quotes and dashes in strings are on purpose: the app shows and matches typographic text.
    "RUF002",
    "RUF003",
    "RUF005",  # `messages + [note]` reads as plainly as unpacking.
]

[tool.ruff.lint.per-file-ignores]
# Test names and sample brand text are long by nature; the fake AIs are long lists of canned answers.
"tests/*" = ["E501", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
