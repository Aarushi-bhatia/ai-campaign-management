services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://campaign:campaign@db:5432/campaign
      DATA_DIR: /data
      # BRAND_DIR in .env is a folder on your machine; inside the container it is mounted here.
      BRAND_DIR: /preload-brand
    volumes:
      - ./backend:/app
      - app-data:/data
      - ${BRAND_DIR:-./brands}:/preload-brand:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
  app-data:
  frontend-modules:
